<script>
  // Desktop canvas is 1440px (Figma). Between 1024 and 1439px scale it proportionally so it stays 1:1 with the design.
  (function () {
    function fit() {
      var w = document.documentElement.clientWidth || window.innerWidth;
      document.documentElement.style.setProperty('--z', w >= 1024 && w < 1440 ? (w / 1440).toFixed(4) : 1);
      document.documentElement.classList.toggle('is-scaled', w >= 1024 && w < 1440);
    }
    fit(); window.addEventListener('resize', fit);
  })();
</script>
